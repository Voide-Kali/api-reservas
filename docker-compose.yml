services:
  mongodb:
    image: mongo:8.0
    container_name: api-reservas-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: senha_dev_123
      MONGO_INITDB_DATABASE: api_reservas
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
